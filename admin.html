<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>طلبات ELTAYP</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
.adm{max-width:880px;margin:0 auto;padding:16px}
.adm h1{font-size:1.4rem;margin:8px 0}
.bar2{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--g);background:#fff;color:var(--g);border-radius:18px;padding:4px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
.ord{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.ord.new{border-color:var(--g);box-shadow:0 0 0 2px rgba(31,107,98,.15)}
.ord .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.ord .m{color:#5a666d;font-size:.9rem}
.ord ul{margin:6px 0;padding:0 18px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
.acts button.cur{background:var(--g);color:#fff;border-color:var(--g)}
#upd{background:none;padding:0;font-size:.8rem;color:#7a858c;display:block}.bar2>div:last-child{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{display:inline-block;border-radius:10px;padding:0 8px;font-size:.8rem;background:#eef3f2;color:var(--g)}
</style>
</head>
<body>
<div class="adm">
  <h1>طلبات الموقع</h1>
  <form id="login" novalidate>
    <label>الإيميل<input name="email" type="email" autocomplete="username" dir="ltr"></label>
    <label>كلمة السر<input name="password" type="password" autocomplete="current-password" dir="ltr"></label>
    <button class="btn full" type="submit">دخول</button>
  </form>
  <div id="panel" hidden>
    <div class="bar2">
      <div class="tabs" id="tabs"></div>
      <div><span id="upd" class="note"></span> <button class="link" id="refresh" type="button">تحديث</button> <button class="link" id="logout" type="button">خروج</button></div>
    </div>
    <div id="list"></div>
  </div>
  <p id="msg" role="status"></p>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
