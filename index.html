<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الطيب | ELTAYP Perfume</title>
<meta name="description" content="الطيب | ELTAYP. متجر عطور قيد التجهيز.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar">الموقع قيد التجهيز · الطلب هيفتح قريبًا</div>
<header class="top">
  <img src="logo-wide.png" alt="ELTAYP Perfume" class="brand">
  <button class="cartbtn" id="openCart" aria-label="السلة">السلة <span id="count">0</span></button>
</header>
<main>
<section class="hero">
  <h1>الطيب قريبًا</h1>
  <p id="heroP">بنجهز العطور والأسعار. أول ما تتأكد هتلاقيها هنا وتقدر تطلب من الموقع.</p>
</section>
<section id="catalog" class="wrap">
  <h2 id="catH">العطور</h2>
  <div id="products" class="grid"></div>
  
</section>
<section class="wrap steps" id="steps"><div><b>١</b><span>اختار</span></div><div><b>٢</b><span>اكتب بياناتك</span></div><div><b>٣</b><span>ابعت الطلب</span></div></section>
</main>

<div id="shade" hidden></div>
<aside id="drawer" aria-hidden="true">
  <div class="dhead"><h3 id="dtitle">السلة</h3><button id="closeCart" aria-label="إغلاق">✕</button></div>
  <div id="step1">
    <ul id="cart"></ul>
    <p id="cartEmpty" class="note">السلة فاضية.</p>
    <p class="total">الإجمالي: <b id="total">0</b> <span class="cur"></span></p>
        <button class="btn full" id="toCheckout">كمّل الطلب</button>
  </div>
  <form id="form" novalidate hidden>
    <label>الاسم <input name="name" required autocomplete="name"></label>
    <label>رقم التليفون <input name="phone" required inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></label>
    <label>المحافظة <input name="city" required autocomplete="address-level1"></label>
    <label>العنوان بالتفصيل <textarea name="address" rows="2" required autocomplete="street-address"></textarea></label>
    <label>ملاحظات (اختياري) <textarea name="notes" rows="2"></textarea></label>
    <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="total">الإجمالي: <b id="total2">0</b> <span class="cur"></span></p>
    <button class="btn full" type="submit" id="send">ابعت الطلب</button>
    <button class="link" type="button" id="back">رجوع للسلة</button>
  </form>
  <div id="done" hidden><h3>وصلنا طلبك</h3><p>هنراجع الطلب ونتواصل معاك على رقمك.</p><button class="btn full" id="closeDone">تمام</button></div>
  <p id="msg" role="status"></p>
</aside>
<footer><div id="social"></div><p>© ELTAYP</p></footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
